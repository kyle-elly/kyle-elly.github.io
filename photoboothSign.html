<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyle and Elly's Photo Booth - Sign</title>

<style>
@font-face {
  font-family: 'Alex Brush';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/alex-brush-latin-regular.woff2') format('woff2');
}

:root {
  --white:            #fdfdfb;
  --eucalyptus-light: #b8c9a4;
  --eucalyptus:       #9caf88;
  --eucalyptus-mid:   #91a67e;
  --eucalyptus-dark:  #7a8f6a;
  --purple:           #a89bc9;
  --purple-dark:      #8b7db8;
  --coral:            #d4a5a5;
  --coral-dark:       #b88585;
  --text:             #4a4a4a;
  --muted:            #999;
  --accent:           var(--eucalyptus-dark);
  --accent-soft:      rgba(156, 175, 136, 0.4);
  --accent-shadow:    rgba(156, 175, 136, 0.25);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #e8e8e6;
}

/* ---- The 8.5 x 11 sheet ---- */
.sheet {
  width: 8.5in;
  height: 11in;
  margin: 24px auto;
  padding: 0.9in 0.8in;

  font-family: 'Georgia', 'Times New Roman', serif;
  color: var(--text);

  background-color: var(--white);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 300 300'><g fill='none' stroke='%239caf88' stroke-width='1.2' opacity='0.35'><path d='M50 40 Q70 60 60 100 Q50 130 70 160'/><ellipse cx='55' cy='55' rx='7' ry='14' fill='%239caf88' opacity='0.5' transform='rotate(-30 55 55)'/><ellipse cx='68' cy='80' rx='7' ry='14' fill='%239caf88' opacity='0.5' transform='rotate(20 68 80)'/><ellipse cx='58' cy='105' rx='7' ry='14' fill='%239caf88' opacity='0.5' transform='rotate(-25 58 105)'/><ellipse cx='72' cy='130' rx='7' ry='14' fill='%239caf88' opacity='0.5' transform='rotate(15 72 130)'/><ellipse cx='63' cy='155' rx='7' ry='14' fill='%239caf88' opacity='0.5' transform='rotate(-20 63 155)'/><path d='M200 200 Q220 220 210 260 Q200 285 215 300'/><ellipse cx='205' cy='210' rx='6' ry='12' fill='%239caf88' opacity='0.5' transform='rotate(-30 205 210)'/><ellipse cx='215' cy='232' rx='6' ry='12' fill='%239caf88' opacity='0.5' transform='rotate(20 215 232)'/><ellipse cx='208' cy='255' rx='6' ry='12' fill='%239caf88' opacity='0.5' transform='rotate(-25 208 255)'/><ellipse cx='218' cy='280' rx='6' ry='12' fill='%239caf88' opacity='0.5' transform='rotate(15 218 280)'/><path d='M240 60 Q220 80 230 110 Q245 135 225 165'/><ellipse cx='237' cy='72' rx='6' ry='12' fill='%239caf88' opacity='0.5' transform='rotate(30 237 72)'/><ellipse cx='225' cy='92' rx='6' ry='12' fill='%239caf88' opacity='0.5' transform='rotate(-20 225 92)'/><ellipse cx='233' cy='118' rx='6' ry='12' fill='%239caf88' opacity='0.5' transform='rotate(25 233 118)'/><ellipse cx='222' cy='142' rx='6' ry='12' fill='%239caf88' opacity='0.5' transform='rotate(-15 222 142)'/></g></svg>");
  background-repeat: repeat;
  background-size: 300px 300px;

  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);

  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* ---- Heading ---- */
h1 {
  margin: 0;
  font-weight: normal;
  line-height: 1.05;
}

h1 .couple {
  display: block;
  font-family: 'Alex Brush', Georgia, cursive;
  font-size: 96px;
  line-height: 1;
  color: var(--eucalyptus-dark);
}

h1 .subtitle {
  display: block;
  font-family: 'Alex Brush', Georgia, cursive;
  font-size: 64px;
  line-height: 1.1;
  color: var(--purple-dark);
}

/* ---- QR code ---- */
.qr {
  margin: 0.55in 0 0.5in 0;
  width: 3.6in;
  height: 3.6in;

  background: #fff;
  border: 3px solid var(--accent-soft);
  border-radius: 14px;
  box-shadow: 0 4px 14px var(--accent-shadow);

  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.qr img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  padding: 10px;
}

.qr .placeholder {
  font-family: 'Georgia', serif;
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--muted);
}

/* ---- Call to action ---- */
.cta {
  margin: 0;
  font-size: 34px;
  color: var(--eucalyptus-dark);
}

.detail {
  margin: 16px 0 0 0;
  font-size: 21px;
  font-style: italic;
  color: var(--text);
}

/* ---- Footer ---- */
.thanks {
  margin-top: auto;
  font-size: 22px;
  font-style: italic;
  color: var(--muted);
}

/* ---- Print ---- */
@page {
  size: letter portrait;
  margin: 0;
}

@media print {
  html, body { background: none; }

  .sheet {
    margin: 0;
    box-shadow: none;
    page-break-after: avoid;
  }
}
</style>
</head>
<body>

  <div class="sheet">

    <h1>
      <span class="couple">Kyle &amp; Elly's</span>
      <span class="subtitle">Photo Booth</span>
    </h1>

    <div class="qr">
      <span class="placeholder">QR CODE</span>
    </div>

    <p class="cta">Scan to View &amp; Download Photos</p>

    <p class="detail">Photos are uploaded throughout the evening.</p>

    <p class="thanks">Thank you for celebrating with us &#9829;</p>

  </div>

</body>
</html>
