<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyle and Elly's Photo Booth - Sign</title>

<link rel="stylesheet" href="shared.css">

<style>
  /* ---- Print-page overrides for shared.css ---- */
  body {
    margin: 0;
    padding: 0;
    min-height: 0;
  }

  .sheet {
    width: 8.5in;
    height: 11in;
    margin: 0 auto;
    padding: 0.85in 0.8in 0.7in 0.8in;

    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  @media screen {
    .sheet { outline: 1px dashed var(--accent-soft); }
  }

  /* ---- Poster-scale headings (beat shared.css media query) ---- */
  .sheet h1 { margin: 0; }

  .sheet h1 .couple   { font-size: 96px; }
  .sheet h1 .subtitle { font-size: 64px; display: block; }

  /* ---- QR card ---- */
  .qr {
    margin: 0.5in 0 0 0;
    width: 3.5in;
    height: 3.5in;

    background: #fff;
    border: 3px solid var(--accent-soft);
    border-radius: 14px;
    box-shadow: 0 4px 14px var(--accent-shadow);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }

  .qr canvas {
    width: 82%;
    height: auto;
    display: block;
    image-rendering: pixelated;
  }

  .qr-url {
    margin: 6px 0 0 0;
    font-size: 19px;
    letter-spacing: 0.5px;
    color: var(--eucalyptus-dark);
  }

  /* ---- Copy ---- */
  .cta {
    margin: 0.42in 0 0 0;
    font-size: 32px;
    color: var(--eucalyptus-dark);
  }

  .detail {
    margin: 14px 0 0 0;
    font-size: 20px;
    line-height: 1.45;
    font-style: italic;
    max-width: 5.4in;
  }

  .divider {
    margin: 0.26in 0 0 0;
    font-size: 20px;
    letter-spacing: 10px;
    color: var(--eucalyptus);
    opacity: 0.75;
  }

  .date {
    margin: 0.2in 0 0 0;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--purple-dark);
  }

  .thanks {
    margin: auto 0 0 0;
    font-size: 22px;
    font-style: italic;
    color: var(--muted);
  }

  /* ---- Print ---- */
  @page { size: letter portrait; margin: 0; }

  @media print {
    .sheet { margin: 0; page-break-after: avoid; }
  }
</style>
</head>
<body>

  <div class="sheet">

    <h1>
      <span class="couple">Kyle and Elly's</span>
      <span class="subtitle">Photo Booth</span>
    </h1>

    <div class="qr">
      <canvas id="qrCanvas"></canvas>
      <p class="qr-url">kyle-elly.github.io</p>
    </div>

    <p class="cta">Scan to Share &amp; Browse</p>

    <p class="detail">
      Upload your own photos and videos, then browse the
      guest gallery and photo booth gallery.
    </p>

    <div class="divider">&middot; &middot; &middot;</div>

    <p class="date">Kyle &amp; Elly &middot; August 8th, 2026</p>

    <p class="thanks">Thank you for celebrating with us &#9829;</p>

  </div>

  <script>
  /* QR for https://kyle-elly.github.io/   level H, 33x33, pre-encoded */
  var QR_DATA = "feac61bf882bf16a08ba956dae8ba2ebb2e8ba615cae8829c78208feaaaabf800820c8003ada50f382449d1658034d42510c172c84781a4f6e9086cbc112c81e618a5d00ca8060a067d340498449c59a081fe25e030103a65df073fa129c8bcde4a40882b803960b0787d0f093793bf8800cc3d8e8fe4f1dad08251378f8badeacf98bac53acd0baf180640823ea6720fe7e23c30";
  var QR_N = 33, QR_ROW = 9;

  (function () {
    var quiet = 4, total = QR_N + quiet * 2, scale = 36;

    var cv = document.getElementById("qrCanvas");
    cv.width = cv.height = total * scale;

    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = "#000000";

    for (var r = 0; r < QR_N; r++) {
      var hex = QR_DATA.substr(r * QR_ROW, QR_ROW), bits = "";
      for (var i = 0; i < hex.length; i++) {
        bits += ("000" + parseInt(hex.charAt(i), 16).toString(2)).slice(-4);
      }
      for (var c = 0; c < QR_N; c++) {
        if (bits.charAt(c) === "1") {
          ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
        }
      }
    }
  })();
  </script>

</body>
</html>
